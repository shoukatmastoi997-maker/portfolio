name: deploy website to s3

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # Mandatory for OIDC token retrieval
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: checkout code
        uses: actions/checkout@v4
      - name: Inspect GitHub OIDC Token
        run: |
          # 1. Request the raw OIDC token using GitHub's built-in ID token request environment variables
          RAW_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          
          echo "=== ENCODED JWT (Paste this into jwt.io to decode locally) ==="
          echo "$RAW_TOKEN" | base64
          
          echo "=== DECODED TOKEN CLAIMS (PAYLOAD) ==="
          # Extract and decode the middle payload section of the JWT
          echo "$RAW_TOKEN" | cut -d'.' -f2 | base64 --decode | jq .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254185428379:role/GitHubActions-Portfolio-Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: deploy to s3
        run: |
          aws s3 sync . s3://${{ secrets.bucket_name }} --exclude ".git/*" --exclude ".github/*"
