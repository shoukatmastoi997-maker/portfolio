name: deploy website to s3
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout code
        uses: actions/checkout@v4
      - name: aws configuration
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-a
          aws-access-id: ${{secrets.access_key}}
          aws-secret-acess-key: ${{secrets.secret_key}}
