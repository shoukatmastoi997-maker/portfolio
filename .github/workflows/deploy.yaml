name: deploy website to s3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254185428379:oidc-provider/token.actions.githubusercontent.com
          aws-region: ${{ secrets.AWS_REGION }}

      - name: deploy to s3
        run: |
          aws s3 sync . s3://${{ secrets.bucket_name }} --exclude ".git/*" --exclude ".github/*"
